name: Build and release Rooyesh 3.11.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'source/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: rooyesh-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare project from canonical tracked source
        shell: bash
        run: |
          set -euo pipefail
          test -s source/app/src/main/assets/index.html
          test -s source/app/src/main/java/com/rooyesh/study/MainActivity.java
          test -s source/app/src/main/assets/translator_offline.js
          test -s source/app/src/main/assets/study_mood.js
          test -s source/app/src/main/assets/study_tools.js
          test -s source/app/src/main/assets/study_learning.js
          test -s source/app/src/main/res/drawable/ic_stat_rooyesh.xml
          test -s source/app/src/main/java/com/rooyesh/study/StudyNotifications.java
          test -s source/app/src/main/java/com/rooyesh/study/DailyReminderReceiver.java
          test -s source/app/src/main/java/com/rooyesh/study/BootReceiver.java
          rm -rf app tools
          cp -a source/app app
          cp -a source/tools tools
          cp source/build.gradle build.gradle
          cp source/settings.gradle settings.gradle
          cp source/gradle.properties gradle.properties
          test -s app/src/main/assets/fonts/noto-arabic-regular.woff2
          test -s app/src/main/assets/fonts/noto-arabic-bold.woff2
          test -s app/src/main/assets/fonts/inter-regular.woff2
          test -s app/src/main/assets/fonts/inter-medium.woff2
          test -s app/src/main/assets/fonts/inter-bold.woff2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Check JavaScript syntax and app bridge integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_html_js.py app/src/main/assets/index.html app/src/main/assets/translator_offline.js app/src/main/assets/study_mood.js app/src/main/assets/study_tools.js app/src/main/assets/study_alarm.js app/src/main/assets/study_learning.js
          python3 tools/verify_mlkit_bridge.py
          grep -q "function persistTimerRecovery" app/src/main/assets/index.html
          grep -q "savedAt:now" app/src/main/assets/index.html
          grep -q "window.RooyeshNative.timerFinished" app/src/main/assets/index.html
          ! grep -q "window.AndroidBridge.timerFinished" app/src/main/assets/index.html
          grep -q "public boolean timerFinished(String subject)" app/src/main/java/com/rooyesh/study/MainActivity.java
          grep -q "requestNotificationPermission" app/src/main/java/com/rooyesh/study/MainActivity.java
          grep -q "android.permission.POST_NOTIFICATIONS" app/src/main/AndroidManifest.xml
          grep -q "android.permission.RECEIVE_BOOT_COMPLETED" app/src/main/AndroidManifest.xml
          grep -q 'android:label="رویش"' app/src/main/AndroidManifest.xml
          ! grep -q 'android:label="رویش ۳.۱۱' app/src/main/AndroidManifest.xml
          grep -q "public void studyProgress(int minutes, int dailyGoal)" app/src/main/java/com/rooyesh/study/MainActivity.java
          grep -q "R.drawable.ic_stat_rooyesh" app/src/main/java/com/rooyesh/study/MainActivity.java
          grep -q "StudyNotifications.scheduleDailyAlarms" app/src/main/java/com/rooyesh/study/MainActivity.java
          grep -q "onStudyDataUpdated" app/src/main/assets/index.html
          grep -q "public String scheduleStudyAlarm(String time, boolean repeatDaily, int volumePercent)" app/src/main/java/com/rooyesh/study/MainActivity.java
          grep -q "android.permission.SCHEDULE_EXACT_ALARM" app/src/main/AndroidManifest.xml
          grep -q "StudyAlarmService" app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Rooyesh_3.11.1_MLKit_Debug.apk
          test -s dist/Rooyesh_3.11.1_MLKit_Debug.apk

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          ROOYESH_KEYSTORE_B64: ${{ secrets.ROOYESH_KEYSTORE_B64 }}
          ROOYESH_STORE_PASSWORD: ${{ secrets.ROOYESH_STORE_PASSWORD }}
          ROOYESH_KEY_ALIAS: ${{ secrets.ROOYESH_KEY_ALIAS }}
          ROOYESH_KEY_PASSWORD: ${{ secrets.ROOYESH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ROOYESH_KEYSTORE_B64:-}" || -z "${ROOYESH_STORE_PASSWORD:-}" || -z "${ROOYESH_KEY_ALIAS:-}" || -z "${ROOYESH_KEY_PASSWORD:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are incomplete. Only the separate debug build will be published."
            exit 0
          fi
          printf '%s' "$ROOYESH_KEYSTORE_B64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ROOYESH_STORE_PASSWORD
          keyAlias=$ROOYESH_KEY_ALIAS
          keyPassword=$ROOYESH_KEY_PASSWORD
          EOF
          keytool -list -keystore release-keystore.jks -storepass "$ROOYESH_STORE_PASSWORD" -alias "$ROOYESH_KEY_ALIAS" >/dev/null
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Existing release signing material validated."

      - name: Build and verify installable release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk dist/Rooyesh_3.11.1.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Rooyesh.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose dist/Rooyesh_3.11.1.apk
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging dist/Rooyesh_3.11.1.apk | grep -q "package: name='com.rooyesh.study.app'"
          sha256sum dist/Rooyesh_3.11.1.apk
          test -s dist/Rooyesh.apk

      - name: Synchronize downloadable source archive
        id: sync_source
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='@1609459200' --owner=0 --group=0 --numeric-owner -cf - -C source . | gzip -n > /tmp/rooyesh-source.tar.gz
          if ! cmp -s /tmp/rooyesh-source.tar.gz rooyesh-source.tar.gz; then
            cp /tmp/rooyesh-source.tar.gz rooyesh-source.tar.gz
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rooyesh-source.tar.gz
            git commit -m "Sync downloadable source archive with canonical source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: rooyesh-3.11.1-debug-apk
          path: dist/Rooyesh_3.11.1_MLKit_Debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable signed APK
        if: steps.signing.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.11.1
          target_commitish: ${{ steps.sync_source.outputs.target_sha }}
          name: Rooyesh 3.11.1 — نسخهٔ پایدار
          body: |
            نسخهٔ پایدار رویش ۳.۱۱.۱ برای نصب و به‌روزرسانی نسخهٔ اصلی؛ نام نمایشی برنامه فقط «رویش» است.

            اصلاحات:
            - ذخیره و بازیابی وضعیت تایمر هنگام رفتن برنامه به پس‌زمینه
            - محاسبهٔ زمان سپری‌شده هنگام بسته بودن برنامه
            - درخواست مجوز اعلان از همان شروع برنامه و نمایش نشان تک‌رنگ روی اعلان‌ها
            - اعلان پایدار تقویم مطالعه، بازنشانی روزانه و یادآوری ساعت ۱۳ در صورت شروع‌نکردن
            - ثبت حال‌وهوای هر روز پس از تکمیل هدف، همراه پیام‌های متناسب و بدون تکرار تا پایان مجموعه
            - گزارش هفتگی/ماهانهٔ حال‌وهوا و نشان هر روز در تقویم
            - دسته‌بندی قواعد عربی عمومی و انسانی متوسطه دوم، آموزش ساده و تمرین
            - به‌روزرسانی مستقیم از گیت‌هاب با دانلود فایل APK
            - زنگ روزانه با زمان، تکرار و شدت صدای قابل تنظیم
            - جعبه ابزار درسی با ترجمه و جدول جست‌وجوپذیر ۱۱۸ عنصر
            - اتصال اعلان پایان تایمر به Android
            - بررسی نحو JavaScript و پل بومی پیش از ساخت
            - افزایش versionCode برای امکان به‌روزرسانی
          files: |
            dist/Rooyesh_3.11.1.apk
            dist/Rooyesh.apk
          prerelease: false
          make_latest: true

      - name: Publish debug-only fallback release
        if: steps.signing.outputs.available != 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.11.1-debug-build-${{ github.run_number }}
          target_commitish: ${{ steps.sync_source.outputs.target_sha }}
          name: Rooyesh 3.11.1 — Debug build ${{ github.run_number }}
          body: |
            نسخهٔ آزمایشی debug فقط برای تست است و شناسهٔ جداگانه دارد.
            این فایل جایگزین نصب اصلی قبلی نمی‌شود. برای انتشار نسخهٔ اصلی، کلید امضای قبلی باید به‌صورت GitHub Actions Secrets تنظیم شود.
          files: dist/Rooyesh_3.11.1_MLKit_Debug.apk
          prerelease: true
          make_latest: false
