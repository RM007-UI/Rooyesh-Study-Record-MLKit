name: Build Rooyesh 3.9 ML Kit APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'source-payload/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct and extract project source
        run: |
          cat source-payload/part*.b64 | base64 --decode > rooyesh-source.tar.gz
          tar -tzf rooyesh-source.tar.gz >/dev/null
          tar -xzf rooyesh-source.tar.gz --strip-components=1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Check JavaScript syntax and ML Kit bridge
        run: |
          python3 tools/check_html_js.py app/src/main/assets/index.html app/src/main/assets/translator_offline.js
          python3 tools/verify_mlkit_bridge.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rooyesh-3.9-mlkit-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
