name: Build Rooyesh 3.9 ML Kit APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'rooyesh-source.tar.gz'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify and extract project source
        run: |
          tar -tzf rooyesh-source.tar.gz >/dev/null
          tar -xzf rooyesh-source.tar.gz --strip-components=1
          # DownloadConditions belongs to the common.model package in ML Kit 17.0.3.
          sed -i 's/import com.google.mlkit.nl.translate.DownloadConditions;/import com.google.mlkit.common.model.DownloadConditions;/' app/src/main/java/com/rooyesh/study/MainActivity.java
          # Overlay custom launcher and in-app branding from the tracked source tree.
          cp source/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp source/app/src/main/assets/index.html app/src/main/assets/index.html
          cp source/app/src/main/assets/rooyesh-logo.png app/src/main/assets/rooyesh-logo.png
          mkdir -p app/src/main/res/drawable-nodpi
          cp source/app/src/main/res/drawable-nodpi/rooyesh_logo.png app/src/main/res/drawable-nodpi/rooyesh_logo.png

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Check JavaScript syntax and ML Kit bridge
        run: |
          python3 tools/check_html_js.py app/src/main/assets/index.html app/src/main/assets/translator_offline.js
          python3 tools/verify_mlkit_bridge.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare expanded source folder and APK
        run: |
          mkdir -p source dist
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gradle/' \
            --exclude='app/build/' \
            --exclude='source/' \
            --exclude='dist/' \
            --exclude='rooyesh-source.tar.gz' \
            --exclude='*.apk' \
            --exclude='*.zip' \
            ./ source/
          cp app/build/outputs/apk/debug/app-debug.apk dist/Rooyesh_3.9_MLKit_Debug.apk
          test -s dist/Rooyesh_3.9_MLKit_Debug.apk

      - name: Commit expanded source files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f source
          if git diff --cached --quiet; then
            echo "Expanded source folder is already up to date."
          else
            git commit -m "Publish expanded Rooyesh 3.9 source tree"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: rooyesh-3.9-mlkit-debug
          path: dist/Rooyesh_3.9_MLKit_Debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.9-mlkit-build-${{ github.run_number }}
          name: Rooyesh 3.9 ML Kit — Build ${{ github.run_number }}
          body: |
            فایل نصب برنامهٔ رویش ۳.۹ با ترجمهٔ آفلاین ML Kit.

            فایل `Rooyesh_3.9_MLKit_Debug.apk` را از بخش Assets دانلود کنید.
            این نسخهٔ آزمایشی debug است؛ مدل ترجمهٔ آفلاین در اولین استفاده باید با اینترنت دانلود شود.
          files: dist/Rooyesh_3.9_MLKit_Debug.apk
          prerelease: true
