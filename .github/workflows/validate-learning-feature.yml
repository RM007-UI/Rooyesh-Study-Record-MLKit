name: Validate learning feature

on:
  pull_request:
    branches: [main, feature/flashcards-interview-demo]
    paths:
      - 'source/app/**'
      - 'source/tools/check_html_js.py'
      - 'ai-proxy/**'
      - 'README.md'
      - '.github/workflows/validate-learning-feature.yml'

permissions:
  contents: read

jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check app JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 source/tools/check_html_js.py \
            source/app/src/main/assets/index.html \
            source/app/src/main/assets/translator_offline.js \
            source/app/src/main/assets/study_mood.js \
            source/app/src/main/assets/study_tools.js \
            source/app/src/main/assets/study_alarm.js \
            source/app/src/main/assets/study_learning.js \
            source/app/src/main/assets/study_assistant.js
      - name: Verify feature wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="study_learning.js"' source/app/src/main/assets/index.html
          grep -q 'rooyeshFlashcardsV1' source/app/src/main/assets/study_learning.js
          grep -q 'data-rl-enter-demo' source/app/src/main/assets/study_learning.js
          grep -q 'data-rl-grade' source/app/src/main/assets/study_learning.js
          grep -q 'deepseek-flash' source/app/src/main/assets/study_assistant.js
          grep -q 'beginGoogleSignIn' source/app/src/main/java/com/rooyesh/study/MainActivity.java
          grep -q 'rooyesh_google_web_client_id' source/app/src/main/res/values/ai_config.xml
          node --check ai-proxy/src/index.js
          grep -q 'RooyeshAssistantBridge' source/app/src/main/assets/index.html
          grep -q 'data-ra-approve' source/app/src/main/assets/study_assistant.js
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app tools
          cp -a source/app app
          cp source/build.gradle build.gradle
          cp source/settings.gradle settings.gradle
          cp source/gradle.properties gradle.properties
      - name: Inject configured OAuth and DeepSeek endpoint
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          DEEPSEEK_PROXY_URL: ${{ vars.DEEPSEEK_PROXY_URL || 'https://rooyesh-deepseek-proxy.reza86mirzaei.workers.dev' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("app/src/main/res/values/ai_config.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          values = {
              "rooyesh_google_web_client_id": os.environ.get("GOOGLE_WEB_CLIENT_ID", "").strip(),
              "rooyesh_deepseek_proxy_url": os.environ.get("DEEPSEEK_PROXY_URL", "").strip(),
          }
          for name, value in values.items():
              if value:
                  node = root.find("./string[@name='" + name + "']")
                  if node is None:
                      raise SystemExit("Missing Android string resource: " + name)
                  node.text = value
          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("OAuth client ID injected:", bool(values["rooyesh_google_web_client_id"]))
          print("DeepSeek proxy URL injected:", bool(values["rooyesh_deepseek_proxy_url"]))
          PY
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload interview-demo APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rooyesh-Learning-Lab-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
