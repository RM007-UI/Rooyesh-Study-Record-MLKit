name: Deploy Rooyesh DeepSeek proxy

on:
  workflow_dispatch:
  push:
    branches: [feature/google-login-deepseek]
    paths:
      - 'ai-proxy/**'
      - '.github/workflows/deploy-ai-proxy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.ENABLE_AI_PROXY_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        working-directory: ai-proxy
        run: npm install
      - name: Check proxy syntax
        run: node --check ai-proxy/src/index.js
      - name: Upload DeepSeek API key as Worker secret
        working-directory: ai-proxy
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' "$DEEPSEEK_API_KEY" | npx wrangler secret put DEEPSEEK_API_KEY
      - name: Deploy Worker
        working-directory: ai-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_WEB_CLIENT_ID"
          npx wrangler deploy --var "GOOGLE_WEB_CLIENT_ID:$GOOGLE_WEB_CLIENT_ID" --var "APP_ORIGIN:null"
